<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>404 — what-the-fuck.men</title>

  <link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <link rel="stylesheet" href="/assets/css/404.css?v=1">
</head>
<body>
  <main class="error-page">
    <header class="error-top">
      <a class="brand" href="/" aria-label="Go to what-the-fuck.men home">
        what-the-fuck.men
      </a>
      <span class="status-pill">404 / NOT FOUND</span>
    </header>

    <section class="error-card" aria-labelledby="error-title">
      <div class="error-number" aria-hidden="true">404</div>

      <div class="error-copy">
        <p class="eyebrow">WELL, FUCK.</p>
        <h1 id="error-title">What the fuck happened here?</h1>
        <p class="lead">
          This page doesn’t exist. Maybe it moved. Maybe it never existed.
          Maybe the URL is just having a bad day.
        </p>

        <div class="error-actions">
          <a class="home-button" href="/">
            <span>Go back home</span>
            <span aria-hidden="true">↗</span>
          </a>

          <button class="back-button" type="button" onclick="history.back()">
            Go back
          </button>
        </div>
      </div>

      <div class="error-note">
        <span class="note-dot" aria-hidden="true"></span>
        <span>requested page: <code id="requested-path">/???</code></span>
      </div>
    </section>

    <footer class="error-footer">
      <span>what-the-fuck.men</span>
      <span>still made for fun</span>
    </footer>
  </main>

  <script>
    const path = window.location.pathname + window.location.search;
    const target = document.querySelector('#requested-path');

    if (target) {
      target.textContent = path || '/';
    }
  </script>
</body>
</html>
