<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#ebe9e1">
  <meta name="color-scheme" content="light">

  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">

  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>
  <div class="top-bar" aria-hidden="true"></div>

  <div class="page">
<main>
      <section class="hero">
  <p class="eyebrow">WELL, FUCK.</p>

  <button
    class="shatter-trigger"
    id="shatter-trigger"
    type="button"
    aria-label="Shatter the 404"
    title="Do not click this."
  >
    <span class="headline" id="error-number">404</span>
    <span class="shatter-hint" id="random-message" aria-live="polite">what the fuck happened here?</span>
  </button>
  <p class="zero-results">0 results. 0 regrets.</p>
</section>

      <section class="error-grid">
        <article class="card message-card">
          <div class="quote-mark" aria-hidden="true">“</div>

          <div class="message-copy">
            <h2>This page does not exist.</h2>
            <p>Maybe it moved. Maybe it never existed. Maybe the URL is just having a bad day.</p>
          </div>

          <div class="requested-row">
            <span class="requested-label">requested page</span>
            <code id="requested-url">what-the-fuck.men/???</code>
          </div>
        </article>

        <aside class="card action-card">
          <div>
            <span class="action-kicker">SO...</span>
            <h2>Where now?</h2>
          </div>

          <div class="actions">
            <a class="action black" href="/">
              <span>Go home</span>
              <span aria-hidden="true">↗</span>
            </a>
          </div>
        </aside>
      </section>
    </main>

    <footer class="footer">
      <span>what-the-fuck.men</span>
      <span>still made for fun</span>
    </footer>
  </div>
  <div class="shatter-layer" id="shatter-layer" aria-hidden="true"></div>
  <script src="/assets/js/404.js?v=7"></script>
</body>
</html>
